<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img" aria-labelledby="t d"><title id="t">Series parallel resistor network in question four c OR</title><desc id="d">Input A joins resistor R1 to junction B. The path splits from B into upper branch R2 with current I1 and lower branch R3 with current I2, recombining at output C. Current I enters through R1 and voltage V is across A to C.</desc><g stroke="#172436" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M55 167h105m112 0h82V70h105m112 0h54v194H354v-97M354 264h105m112 0h54M625 167h30"/><rect x="160" y="151" width="112" height="32" rx="3" fill="#f6e9dd"/><rect x="459" y="54" width="112" height="32" rx="3" fill="#f6e9dd"/><rect x="459" y="248" width="112" height="32" rx="3" fill="#f6e9dd"/><path d="M76 167h51m-12-10 15 10-15 10 M381 70h44m-12-10 15 10-15 10 M382 264h44m-12-10 15 10-15 10" stroke="#9c431c"/></g><g font-family="system-ui" fill="#172436" font-size="20" font-weight="600"><text x="48" y="199">A</text><text x="338" y="195">B</text><text x="650" y="197">C</text><text x="202" y="141">R₁</text><text x="498" y="44">R₂</text><text x="498" y="238">R₃</text><text x="86" y="142" fill="#9c431c">I</text><text x="390" y="50" fill="#9c431c">I₁</text><text x="389" y="244" fill="#9c431c">I₂</text><text x="269" y="319">Applied voltage V between A and C</text></g></svg>