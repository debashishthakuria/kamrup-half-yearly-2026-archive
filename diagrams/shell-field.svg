<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 450" role="img" aria-labelledby="t d"><title id="t">Electric field of uniformly charged thin spherical shell</title><desc id="d">For positive charge, the field is zero for distance r less than R; it jumps just outside the shell to kQ divided by R squared and then decreases with inverse square of r. The point on the shell depends on the model and is not assigned a single field value.</desc><g font-family="system-ui" fill="#172436"><text x="110" y="35" font-size="18" font-weight="700">Cross-section</text><circle cx="162" cy="171" r="94" fill="none" stroke="#9c431c" stroke-width="5"/><circle cx="162" cy="171" r="4"/><path d="M162 171h94" stroke="#172436" stroke-width="2"/><text x="197" y="161" font-size="17">R</text><text x="140" y="61" font-size="18">+Q</text><text x="111" y="295" font-size="14">E = 0 inside</text><text x="386" y="35" font-size="18" font-weight="700">E versus r</text><path d="M390 335V90 M390 335H643" stroke="#172436" stroke-width="3"/><text x="365" y="99" font-size="18">E</text><text x="635" y="361" font-size="18">r</text><path d="M390 335H468" stroke="#9c431c" stroke-width="4"/><path d="M468 335V159" stroke="#9c431c" stroke-width="2" stroke-dasharray="6 5"/><path d="M468 159C495 215 526 265 640 305" fill="none" stroke="#9c431c" stroke-width="4"/><circle cx="468" cy="159" r="5" fill="#fff" stroke="#9c431c" stroke-width="2"/><text x="456" y="358" font-size="18">R</text><text x="477" y="149" font-size="16">kQ/R²</text><text x="517" y="245" font-size="17">kQ/r²</text><text x="389" y="398" font-size="13">Ideal thin shell · positive charge</text></g></svg>