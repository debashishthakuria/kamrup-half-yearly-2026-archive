<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="t d"><title id="t">Four capacitor network in question four c</title><desc id="d">Terminals A and B are bottom left and bottom right. C4 joins A and B along bottom branch. The upper branch A to B passes through C1 on left, C2 on top and C3 on right, each 10 microfarads. A 500 volt supply is applied across A and B. C4 is parallel with the series combination C1 C2 C3.</desc><g stroke="#172436" stroke-width="3" fill="none" stroke-linecap="round"><path d="M125 270V210M125 154V72H310 M372 72H575V154M575 210v60 M125 270v35h190m70 0h190v-35"/><path d="M100 154h50m-50 56h50M310 49v46m62-46v46M550 154h50m-50 56h50M315 282v46m70-46v46" stroke-width="4"/><path d="M125 305H65v45h235m38 0h297v-45h-60"/><path d="M300 328v44m38-35v27" stroke-width="4"/></g><g font-family="system-ui" fill="#172436" font-size="18" font-weight="600"><text x="153" y="191">C₁ · 10 μF</text><text x="307" y="38">C₂ · 10 μF</text><text x="433" y="191">C₃ · 10 μF</text><text x="304" y="263">C₄ · 10 μF</text><text x="94" y="298">A</text><text x="586" y="298">B</text><text x="266" y="355">+</text><text x="344" y="355">−</text><text x="443" y="368">500 V across A–B</text></g></svg>