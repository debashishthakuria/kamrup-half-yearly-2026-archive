<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d"><title id="t">Wheatstone bridge schematic</title><desc id="d">Four resistive arms P, Q, R, S form a diamond with a galvanometer G across B and D. A source is connected between A and C. At balance current through G is zero and P over Q equals R over S.</desc><g stroke="#172436" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M110 160 280 58 450 160 280 262Z"/><path d="M280 58V120M280 200v62"/><circle cx="280" cy="160" r="39" fill="#fffdf9"/><rect x="160" y="97" width="62" height="27" rx="2" transform="rotate(-31 191 110)" fill="#fffdf9"/><rect x="338" y="97" width="62" height="27" rx="2" transform="rotate(31 369 110)" fill="#fffdf9"/><rect x="160" y="198" width="62" height="27" rx="2" transform="rotate(31 191 211)" fill="#fffdf9"/><rect x="338" y="198" width="62" height="27" rx="2" transform="rotate(-31 369 211)" fill="#fffdf9"/><path d="M110 160H50v155h195m28 0h237V160h-60"/><path stroke-width="5" d="M245 295v40m28-32v24"/></g><g fill="#9c431c" font-family="system-ui" font-size="22" font-weight="700"><text x="186" y="83">P</text><text x="372" y="85">R</text><text x="183" y="247">Q</text><text x="371" y="247">S</text><text x="271" y="168">G</text><text x="92" y="155">A</text><text x="274" y="42">B</text><text x="459" y="166">C</text><text x="274" y="289">D</text><text x="219" y="365">+</text><text x="296" y="365">−</text></g></svg>